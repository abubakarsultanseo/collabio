name: Collaboration reminders

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  process-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Call the reminder endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET" || { echo "Add CRON_SECRET in GitHub Actions secrets."; exit 1; }
          curl --fail-with-body --silent --show-error \
            --request GET \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "https://collabio-11pjzgoc-outreach-d699.vercel.app/api/cron/reminders"
